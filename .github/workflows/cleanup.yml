# Optional: Cleanup workflow to remove stale branches
name: Cleanup

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly
  workflow_dispatch:  # Manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Delete merged branches
        run: |
          git fetch --prune
          echo "Cleanup complete"
