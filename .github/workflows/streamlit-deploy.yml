name: Deploy Streamlit App

on:
  push:
    branches: [ streamlit-app ]
    paths:
      - 'streamlit_app.py'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Streamlit Cloud
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy notification
      run: |
        echo "Streamlit app updated!"
        echo "Visit: https://share.streamlit.io"
        echo "Note: Manual deployment may be required on Streamlit Cloud"
    
    - name: Validate Streamlit app
      run: |
        python -m pip install --upgrade pip
        pip install streamlit plotly pandas
        python -c "import ast; ast.parse(open('streamlit_app.py').read())"
        echo "✓ Streamlit app syntax is valid"

